  <text x="64" y="160" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="#F9FAFB" filter="url(#glow)">Samrender Singh Saini</text>

  <!-- typing roles -->
  <g font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="26" fill="#A3E635">
