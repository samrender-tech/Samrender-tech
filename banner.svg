<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t">
<title id="t">Samrender Singh Saini – CS Undergrad at VIT</title>
<defs>
  <clipPath id="frame"><rect width="1280" height="360" rx="16"/></clipPath>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
