    <feComposite in2="b" operator="in" result="g"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="c1"><rect x="64" y="188" height="36" width="0">
    <animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0;0.12;0.28;0.32;1" values="0;370;370;0;0"/>
  </rect></clipPath>
  <clipPath id="c2"><rect x="64" y="188" height="36" width="0">
    <animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0;0.3333;0.4533;0.6133;0.6533;1" values="0;0;432;432;0;0"/>
  </rect></clipPath>
  <clipPath id="c3"><rect x="64" y="188" height="36" width="0">
    <animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0;0.6667;0.7867;0.9467;0.9867;1" values="0;0;416;416;0;0"/>
  </rect></clipPath>
</defs>

